sonar.organization=blue-dots-economy
sonar.projectKey=Blue-Dots-Economy_signals-search
sonar.projectName=signals-search
sonar.sourceEncoding=UTF-8

# Tests live next to the code they cover (src/**/*.test.ts) plus shared helpers
# and fixtures under test/, so mark them via sonar.test.inclusions rather than
# splitting sonar.sources / sonar.tests.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,docker/**,docs/**,test/docker/**,openapi.json,**/*.md

sonar.test.inclusions=**/*.test.ts,test/**
sonar.coverage.exclusions=**/*.test.ts,test/**,scripts/**,**/*.config.*,**/main.ts,src/db/migrations/**,**/*.d.ts

# Produced by `pnpm test:coverage` (vitest v8 provider, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
