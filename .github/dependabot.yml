version: 2

# Docker Hardened Image bases live on dhi.io, which refuses anonymous pulls — so
# without this Dependabot cannot read the manifests and base-image update PRs for
# any Dockerfile using `FROM dhi.io/...` simply stop appearing. Nothing errors,
# which is what makes it worth being explicit about.
#
# PREREQUISITE: these are DEPENDABOT secrets, a separate store from Actions
# secrets — set them under Settings > Secrets and variables > Dependabot.
# Note the username must be a secret here: Dependabot registry config cannot
# reference `vars`, which is what the Actions workflows use for it.
registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_TOKEN}}
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "UTC"
    # The limit counts open *version-update* PRs. Grouped updates plus a few
    # singletons can sit right at 5 and silently block any further npm PR from
    # being raised (observed in aggregator-dpg on 2026-08-04). 10 leaves headroom
    # without becoming a flood.
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

    ignore:
      # typescript-eslint does not support TS 7 yet — hold the major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Hold the vitest major, and @vitest/coverage-v8 with it: coverage-v8 peers on
      # the EXACT vitest version, so moving one alone leaves an unmet peer and a
      # silently broken `pnpm test:coverage` — green CI, no lcov for SonarCloud.
      # (Dependabot #91 proposed exactly that; see #97.) vite is an explicit
      # devDependency so the version vitest resolves is ours to choose, not
      # whatever the lockfile happens to be holding — its major is held for the
      # same lockstep reason. Note the pin is ^8 now, not the ^7 this comment
      # used to claim.
      #
      # Both vitest and coverage-v8 now sit at 4.1.11, taken as the
      # CVE-2026-84373 floor (the advisory covers >= 2.1.0, < 4.1.11). Held from
      # here is v5, and deliberately: it requires Vite 6.4+ and clears mocks by
      # default before each test. Dependabot proposed that jump straight from
      # 3.2.7 via the security path (#161) and it went red.
      #
      # Worth remembering why this hold had to be lifted at all: holding the
      # major also held the 3.x -> 4.x move the CVE fix needed, so the patch
      # could only reach us as a security PR proposing v5 that could never
      # merge. A major hold must not become a floor hold.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @types/node must track the Node runtime major, which is 24 everywhere
      # here (engines, CI node-version, and both Dockerfile stages). Types ahead
      # of the runtime let code typecheck against APIs that do not exist at run
      # time — #94 (24 -> 25) passed CI only because no test happens to touch a
      # 25-only API. Lift this when the base image and `engines` move to 25.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keeps CI workflow action versions current
  - package-ecosystem: "github-actions"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:15"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base images — one entry per directory containing a Dockerfile
  - package-ecosystem: "docker"
    # Needed to read dhi.io manifests; see the registries block at the top.
    registries:
      - dhi
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directories:
      - "/"
      - "/docker/tei-bge-m3"
      - "/test/docker"
    schedule:
      interval: "monthly"
      time: "03:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    ignore:
      # The TEI serving version is pinned deliberately, not lazily. TEI 1.8.0
      # changed the default GeLU from erf to tanh, and bge-m3 is `hidden_act:
      # gelu` (config.json at the pinned revision), so ANY upgrade past 1.7
      # changes the vectors this service produces. Because `modelVersion` is only
      # `<model>@<dim>` (src/worker/main.ts), that drift is invisible: content
      # hashes do not change, nothing is re-embedded, old and new vectors coexist
      # under one model_version, and the /v1/relevance comparability guard cannot
      # see it (#102). 1.9.0 also flips --auto-truncate to default true, turning
      # an over-long input from an error into a silent truncation.
      #
      # There is no security pressure: the Dockerfile has no Dependabot alerts,
      # and 1.8/1.9's features (Qwen3, Llama, Blackwell, CUDA fixes) do not apply
      # to a CPU deployment pinned to bge-m3.
      #
      # Upgrading is a planned migration — serving version into modelVersion, new
      # image tag, matching chart pin in bluedots-automation, full re-index. See
      # #102 and remove this entry when that work is scheduled.
      - dependency-name: "ghcr.io/huggingface/text-embeddings-inference"
      # The python base of the download stage is NOT held: it never ships (only
      # /hf is copied into the final TEI image) and PRs now build it (#101).
