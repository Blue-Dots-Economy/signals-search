name: Build and Push image (tei-bge-m3)

# Build and publish the TEI embedding image with BAAI/bge-m3 baked in
# (docker/tei-bge-m3/Dockerfile). Consumed by the bluedots-automation
# search-embeddings chart.
#
# MANUAL ONLY (#756). The previous `push: branches: [develop]` trigger published
# on a branch push, and the `pull_request` trigger built without pushing.
#
# Two consequences worth knowing. First, nothing now exercises this Dockerfile
# before a manual run: a broken edit (an unavailable base tag, a pip resolution
# failure in the download stage) surfaces when someone builds it, not in review —
# Dependabot's docker-group PR #85 was exactly that case. Second, this image is
# NOT built by a release tag, so cutting a release does not refresh it; it has to
# be rebuilt here by hand and its new tag pinned in global-images.yaml.
#
# Note this workflow does not use docker/metadata-action: the tags below are
# hardcoded, and the stable one encodes the TEI version, so bumping the base
# image in the Dockerfile means changing that tag AND the chart's pin.
on:
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: docker/tei-bge-m3
          push: true
          # Stable tag the search-embeddings chart pins to, plus an immutable sha tag.
          # NOTE: the stable tag encodes the TEI version, so bumping the base image
          # in the Dockerfile means changing this tag AND the chart's pin in
          # bluedots-automation — otherwise `cpu-1.7-bge-m3` would ship a different
          # TEI. See the notes on #85.
          tags: |
            ghcr.io/blue-dots-economy/tei-bge-m3:cpu-1.7-bge-m3
            ghcr.io/blue-dots-economy/tei-bge-m3:sha-${{ github.sha }}

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # This image matters more than most: it is a third-party HuggingFace TEI base
      # with model weights baked in, so it is the least-inspected supply-chain
      # surface in the estate and nothing in package.json describes its contents.
      #
      # Scanned by digest rather than by the mutable `cpu-1.7-bge-m3` tag, so each
      # result is tied to the artifact built in that run. The old
      # `github.event_name != 'pull_request'` guards are gone with the PR trigger:
      # every run of this workflow now builds AND pushes, so the digest always
      # refers to something that exists in the registry.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/blue-dots-economy/tei-bge-m3@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-tei-bge-m3
