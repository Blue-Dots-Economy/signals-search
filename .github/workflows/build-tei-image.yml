name: build-tei-image

# Build and publish the TEI embedding image with BAAI/bge-m3 baked in
# (docker/tei-bge-m3/Dockerfile). Consumed by the bluedots-automation
# search-embeddings chart. Rarely changes — runs on manual dispatch and when the
# Dockerfile / pinned revision changes on develop.
#
# PRs touching those same paths run a build WITHOUT pushing. Before this, a change
# to the Dockerfile had no CI at all: it was first exercised only after merging to
# develop, so a broken edit (an unavailable base tag, a pip resolution failure in
# the download stage) surfaced past the point of review. Dependabot's docker-group
# PR #85 is exactly that case.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - docker/tei-bge-m3/**
      - .github/workflows/build-tei-image.yml
  pull_request:
    paths:
      - docker/tei-bge-m3/**
      - .github/workflows/build-tei-image.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning
    steps:
      - uses: actions/checkout@v7

      # Not needed for the PR path, which only builds. Skipping it also keeps
      # Dependabot-raised PRs working, where GITHUB_TOKEN is read-only.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: docker/tei-bge-m3
          push: ${{ github.event_name != 'pull_request' }}
          # Stable tag the search-embeddings chart pins to, plus an immutable sha tag.
          # NOTE: the stable tag encodes the TEI version, so bumping the base image
          # in the Dockerfile means changing this tag AND the chart's pin in
          # bluedots-automation — otherwise `cpu-1.7-bge-m3` would ship a different
          # TEI. See the notes on #85.
          tags: |
            ghcr.io/blue-dots-economy/tei-bge-m3:cpu-1.7-bge-m3
            ghcr.io/blue-dots-economy/tei-bge-m3:sha-${{ github.sha }}

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # This image matters more than most: it is a third-party HuggingFace TEI base
      # with model weights baked in, so it is the least-inspected supply-chain
      # surface in the estate and nothing in package.json describes its contents.
      #
      # Scanned by digest, not by tag: buildx pushes straight to the registry
      # without loading into the local docker image store, so the action's
      # `imageid` output is not resolvable by Trivy. The digest guard also means the
      # PR path — which builds WITHOUT pushing, so there is no digest and nothing in
      # any registry to pull — skips cleanly instead of failing.
      - name: Trivy image scan
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/blue-dots-economy/tei-bge-m3@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: always() && steps.build.outputs.digest != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-tei-bge-m3
