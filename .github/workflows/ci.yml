name: CI

on:
  # `feature` is the integration branch every plan PR targets (see CLAUDE.md
  # "Workflow"); without it here, those PRs merged with no CI and regressions
  # only surfaced at the develop promotion. Keep main/develop for the
  # promotion path.
  push:
    branches: [main, develop, feature]
    # Release tags. Additive: the gated :develop publish below is unchanged.
    #   v*.*.*      semver releases   e.g. v1.2.0
    #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
    #               <YYYYMM>-s<sprint>-rc<candidate>. A fix for an issue found
    #               in -rc1 ships as -rc2, so every candidate is its own image.
    #               Supersedes the dated GA-<date> scheme, no longer built here.
    # GitHub reads this workflow FROM THE TAGGED COMMIT, so a tag cut from a
    # branch predating this change will not pick the new patterns up.
    tags: ['v*.*.*', '20*-s*-rc*']
  pull_request:
    branches: [main, develop, feature]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Job-level (not step-level) so the SonarCloud step's `if:` can read it —
    # the `secrets` context is unavailable in a step conditional, and a step's
    # own `env:` block is not in scope for its own `if:`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # fetch-depth: 0 so the SonarCloud scan below can attribute new code to
      # the right commits (a shallow clone leaves it blind to history).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # --ignore-scripts: no dependency lifecycle script is needed to build or
      # test this service. pnpm 10 already blocks them by default (cpu-features,
      # esbuild, protobufjs and ssh2 are reported as ignored on every install and
      # nothing depends on them having run — esbuild resolves its binary from the
      # @esbuild/<platform> optional package, and ssh2 falls back to pure JS), so
      # this makes the existing behaviour explicit rather than relying on a pnpm
      # default. There is no root pre/post-install script to preserve either.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: OpenAPI spec drift check
        run: |
          pnpm spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm spec:dump' and commit the result"; exit 1; }

      # Pre-build the Postgres test image so Testcontainers' fromDockerfile build
      # hits the buildkit cache instead of a cold build (which can exceed vitest's
      # hookTimeout on a cache miss). imresamu/postgis is the multi-arch base; on
      # the amd64 runner this also resolves/pulls the amd64 manifest up front.
      - name: Pre-build test Postgres image (pgvector + postgis)
        run: docker build -t signals-search-pg-test test/docker -f test/docker/Dockerfile.postgres

      # --coverage rather than a second `pnpm test` run: the suite spins up
      # Testcontainers, so running it twice to produce lcov would roughly double
      # CI time. There are no coverage thresholds, so this cannot fail the build
      # for coverage reasons — only for real test failures, same as before.
      - name: Test (with coverage)
        run: pnpm test:coverage

      # Two independent guards, for two different failure modes:
      #   `if:`               — no token at all. GitHub withholds repo secrets from
      #                         Dependabot-raised (and fork) pull_request runs, so an
      #                         ungated scan exits 3 with "Not authorized or project
      #                         not found" on every dependency PR. Skip, don't run.
      #   `continue-on-error` — token present but the scan fails (SonarCloud outage,
      #                         expired token, quality gate). publish-image depends on
      #                         this job, so that must not stop a green build from
      #                         publishing the :develop image; problems surface in the
      #                         run log and SonarCloud's own commit check instead.
      # SONAR_TOKEN comes from the job-level `env` above — a step's own `env:` block
      # is not in scope for its own `if:`.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        continue-on-error: true

  # ── PR-path app-image smoke build (#138) ───────────────────────────────────
  # The app Dockerfile had no PR-path build at all: the only `docker build` in
  # build-and-test is the Testcontainers Postgres image, and publish-image is
  # gated on a develop/tag PUSH. So the first execution of a Dockerfile change
  # was the same run that published :develop — the failure mode was "broken image
  # shipped", not "red PR". This job closes that: it builds the runtime target
  # and proves the image actually runs.
  #
  # Not just `node -e "require(...)"`: booting the container and probing /health
  # also catches a missing dist/ file, a bad CMD, and a boot-time crash, none of
  # which a resolve check sees. /health is a static {status:'ok'} handler and
  # needs no backing services — postgres.js connects lazily and ioredis retries
  # in the background — so no service containers are required. (/ready is the one
  # that touches Postgres and Redis; deliberately not probed here.)
  smoke-image:
    name: smoke-image (PR-path Dockerfile build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Job-level so the step `if:`s below can read it — the `secrets` context is
    # not available in a step conditional, and a step's own `env:` is not in
    # scope for its own `if:` (same reason the SonarCloud step above does this).
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The Dockerfile's DHI bases live on dhi.io, which refuses anonymous pulls,
      # so the build cannot even reach the first FROM without this. GitHub
      # withholds repo secrets from fork and Dependabot-raised pull_request runs,
      # which is why every step below is gated on the token being present rather
      # than failing: an ungated build would turn every dependency-bump PR red
      # for a missing credential rather than a real defect.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_TOKEN != ''
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the runtime image
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          load: true          # into the local docker store, so it can be run below
          push: false
          tags: signals-search:pr
          # Shares the gha cache with publish-image, so this is usually a warm
          # build rather than a second cold one.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and probe /health
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          set -euo pipefail
          # NETWORK_CONFIG_PATH is read at boot (loadNetworkRegistry) and is not
          # baked into the image, so mount the test fixture. The rest are the
          # minimum the config schema demands; none are dialled before /health.
          docker run -d --name smoke -p 3100:3100 \
            -e DATABASE_URL='postgres://smoke:smoke@127.0.0.1:5432/smoke' \
            -e REDIS_URL='redis://127.0.0.1:6379' \
            -e EMBEDDING_BASE_URL='http://127.0.0.1:8080' \
            -e EMBEDDING_MODEL='BAAI/bge-m3' \
            -e EMBEDDING_DIM='1024' \
            -e NETWORK_CONFIG_PATH='/networks' \
            -v "$PWD/test/fixtures/networks:/networks:ro" \
            signals-search:pr

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/health | grep -q '"status":"ok"'; then
              echo "runtime image booted and served /health"
              exit 0
            fi
            # A dead container will never recover, so stop waiting on it.
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              break
            fi
            sleep 1
          done

          # The runtime stage is shell-less, so container logs are the only way in.
          echo "::error::the runtime image did not serve /health — logs follow"
          docker logs smoke
          exit 1

      - name: Clean up
        if: always() && env.DOCKERHUB_TOKEN != ''
        run: docker rm -f smoke 2>/dev/null || true

      - name: Explain the skip
        if: env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::warning::smoke-image skipped: no dhi.io credential on this run \
          (fork or Dependabot PR). The image build is still covered on the \
          develop/tag publish path."

  # Publish the :develop image only after build-and-test passes, on a develop
  # push. Gating publish inside the CI run (rather than a separate push-triggered
  # workflow) means a red build never publishes :develop, and there is no gap or
  # default-branch caveat (as workflow_run would have). Manual builds: build-image.yml.
  publish-image:
    needs: build-and-test
    # develop pushes publish :develop (as before); release tags publish an image
    # named after the tag. Both go through `needs: build-and-test`, so a red build
    # can never publish either — which is why this job lives here rather than in
    # build-image.yml (the manual escape hatch, which has no such dependency).
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The DHI base layers in the Dockerfile come from dhi.io, which refuses
      # anonymous pulls even for the free Apache-2.0 catalog. Without this the
      # build fails at the first FROM.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/blue-dots-economy/signals-search
          # `type=raw,value=develop` MUST stay gated on the develop branch. It was
          # unconditional, which was harmless while this job only ran on develop —
          # but now that tags reach it, an ungated entry would stamp :develop onto
          # every release image, i.e. a release masquerading as the develop build.
          #
          # `type=ref,event=tag` emits the tag VERBATIM so the image tag equals the
          # release tag (v1.2.0 -> v1.2.0, 202608-s1-rc1 -> 202608-s1-rc1).
          #
          # Comments stay OUT of the block scalar: it is passed to the action
          # verbatim, not parsed as YAML.
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # Mirrors build-image.yml. Both publish paths need it: build-image.yml is the
      # manual escape hatch, this is the gated :develop publish — the stream that
      # ships most often, so scanning only the manual path would leave the busiest
      # artifact unscanned.
      #
      # Scanned by digest: buildx pushes to the registry without loading into the
      # local docker image store, so `imageid` is not resolvable by Trivy.
      - name: Trivy image scan
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/blue-dots-economy/signals-search@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never blocks the :develop publish

      - name: Upload Trivy image SARIF
        if: always() && steps.build.outputs.digest != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-app
