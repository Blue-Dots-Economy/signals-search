name: CI

on:
  # No tags and no `feature` push here (#756). Both existed to drive the
  # `publish-image` job that used to live in this file; image publishing moved
  # out to build-image.yml, which owns the release-tag trigger now. PRs into
  # `feature` still run CI against the merge commit, so the integration branch
  # keeps its gate; what is gone is the duplicate post-merge run.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, feature]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Job-level (not step-level) so the SonarCloud step's `if:` can read it —
    # the `secrets` context is unavailable in a step conditional, and a step's
    # own `env:` block is not in scope for its own `if:`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # fetch-depth: 0 so the SonarCloud scan below can attribute new code to
      # the right commits (a shallow clone leaves it blind to history).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # --ignore-scripts: no dependency lifecycle script is needed to build or
      # test this service. pnpm 10 already blocks them by default (cpu-features,
      # esbuild, protobufjs and ssh2 are reported as ignored on every install and
      # nothing depends on them having run — esbuild resolves its binary from the
      # @esbuild/<platform> optional package, and ssh2 falls back to pure JS), so
      # this makes the existing behaviour explicit rather than relying on a pnpm
      # default. There is no root pre/post-install script to preserve either.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: OpenAPI spec drift check
        run: |
          pnpm spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm spec:dump' and commit the result"; exit 1; }

      # Pre-build the Postgres test image so Testcontainers' fromDockerfile build
      # hits the buildkit cache instead of a cold build (which can exceed vitest's
      # hookTimeout on a cache miss). imresamu/postgis is the multi-arch base; on
      # the amd64 runner this also resolves/pulls the amd64 manifest up front.
      - name: Pre-build test Postgres image (pgvector + postgis)
        run: docker build -t signals-search-pg-test test/docker -f test/docker/Dockerfile.postgres

      # --coverage rather than a second `pnpm test` run: the suite spins up
      # Testcontainers, so running it twice to produce lcov would roughly double
      # CI time. There are no coverage thresholds, so this cannot fail the build
      # for coverage reasons — only for real test failures, same as before.
      - name: Test (with coverage)
        run: pnpm test:coverage

      # Two independent guards, for two different failure modes:
      #   `if:`               — no token at all. GitHub withholds repo secrets from
      #                         Dependabot-raised (and fork) pull_request runs, so an
      #                         ungated scan exits 3 with "Not authorized or project
      #                         not found" on every dependency PR. Skip, don't run.
      #   `continue-on-error` — token present but the scan fails (SonarCloud outage,
      #                         expired token, quality gate). A scan that fails for
      #                         reasons unrelated to the code must not redden CI;
      #                         problems surface in the run log and SonarCloud's own
      #                         commit check instead.
      # SONAR_TOKEN comes from the job-level `env` above — a step's own `env:` block
      # is not in scope for its own `if:`.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true

  # ── PR-path app-image smoke build (#138) ───────────────────────────────────
  # The app Dockerfile had no PR-path build at all: the only `docker build` in
  # build-and-test is the Testcontainers Postgres image, and publishing happens
  # on a release tag in build-image.yml. So the first execution of a Dockerfile
  # change would otherwise be the release build — the failure mode is "broken
  # image shipped", not "red PR". This job closes that: it builds the runtime
  # target and proves the image actually runs. It is now the ONLY pre-release
  # exercise of the app Dockerfile, so keep it.
  #
  # Not just `node -e "require(...)"`: booting the container and probing /health
  # also catches a missing dist/ file, a bad CMD, and a boot-time crash, none of
  # which a resolve check sees. /health is a static {status:'ok'} handler and
  # needs no backing services — postgres.js connects lazily and ioredis retries
  # in the background — so no service containers are required. (/ready is the one
  # that touches Postgres and Redis; deliberately not probed here.)
  smoke-image:
    name: smoke-image (PR-path Dockerfile build)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Job-level so the step `if:`s below can read it — the `secrets` context is
    # not available in a step conditional, and a step's own `env:` is not in
    # scope for its own `if:` (same reason the SonarCloud step above does this).
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The Dockerfile's DHI bases live on dhi.io, which refuses anonymous pulls,
      # so the build cannot even reach the first FROM without this. GitHub
      # withholds repo secrets from fork and Dependabot-raised pull_request runs,
      # which is why every step below is gated on the token being present rather
      # than failing: an ungated build would turn every dependency-bump PR red
      # for a missing credential rather than a real defect.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_TOKEN != ''
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the runtime image
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          load: true          # into the local docker store, so it can be run below
          push: false
          tags: signals-search:pr
          # Shares the gha cache with build-image.yml, so this is usually a warm
          # build rather than a second cold one.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and probe /health
        if: env.DOCKERHUB_TOKEN != ''
        run: |
          set -euo pipefail
          # NETWORK_CONFIG_PATH is read at boot (loadNetworkRegistry) and is not
          # baked into the image, so mount the test fixture. The rest are the
          # minimum the config schema demands; none are dialled before /health.
          docker run -d --name smoke -p 3100:3100 \
            -e DATABASE_URL='postgres://smoke:smoke@127.0.0.1:5432/smoke' \
            -e REDIS_URL='redis://127.0.0.1:6379' \
            -e EMBEDDING_BASE_URL='http://127.0.0.1:8080' \
            -e EMBEDDING_MODEL='BAAI/bge-m3' \
            -e EMBEDDING_DIM='1024' \
            -e NETWORK_CONFIG_PATH='/networks' \
            -v "$PWD/test/fixtures/networks:/networks:ro" \
            signals-search:pr

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/health | grep -q '"status":"ok"'; then
              echo "runtime image booted and served /health"
              exit 0
            fi
            # A dead container will never recover, so stop waiting on it.
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              break
            fi
            sleep 1
          done

          # The runtime stage is shell-less, so container logs are the only way in.
          echo "::error::the runtime image did not serve /health — logs follow"
          docker logs smoke
          exit 1

      - name: Clean up
        if: always() && env.DOCKERHUB_TOKEN != ''
        run: docker rm -f smoke 2>/dev/null || true

      - name: Explain the skip
        if: env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::warning::smoke-image skipped: no dhi.io credential on this run \
          (fork or Dependabot PR). The image build is still covered on the \
          release-tag publish path in build-image.yml."
