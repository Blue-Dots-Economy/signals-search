name: CI

on:
  # `feature` is the integration branch every plan PR targets (see CLAUDE.md
  # "Workflow"); without it here, those PRs merged with no CI and regressions
  # only surfaced at the develop promotion. Keep main/develop for the
  # promotion path.
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main, develop, feature]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the SonarCloud scan below can attribute new code to
      # the right commits (a shallow clone leaves it blind to history).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: OpenAPI spec drift check
        run: |
          pnpm spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm spec:dump' and commit the result"; exit 1; }

      # Pre-build the Postgres test image so Testcontainers' fromDockerfile build
      # hits the buildkit cache instead of a cold build (which can exceed vitest's
      # hookTimeout on a cache miss). imresamu/postgis is the multi-arch base; on
      # the amd64 runner this also resolves/pulls the amd64 manifest up front.
      - name: Pre-build test Postgres image (pgvector + postgis)
        run: docker build -t signals-search-pg-test test/docker -f test/docker/Dockerfile.postgres

      # --coverage rather than a second `pnpm test` run: the suite spins up
      # Testcontainers, so running it twice to produce lcov would roughly double
      # CI time. There are no coverage thresholds, so this cannot fail the build
      # for coverage reasons — only for real test failures, same as before.
      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Publish the :develop image only after build-and-test passes, on a develop
  # push. Gating publish inside the CI run (rather than a separate push-triggered
  # workflow) means a red build never publishes :develop, and there is no gap or
  # default-branch caveat (as workflow_run would have). Manual builds: build-image.yml.
  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/blue-dots-economy/signals-search
          tags: |
            type=raw,value=develop
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
